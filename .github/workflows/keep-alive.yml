name: Render Keep-Alive (Zero Cold Start)

on:
  schedule:
    # Ejecutar cada 10 minutos para mantener el contenedor activo
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Check
        run: |
          curl -s --fail https://taskmaster-soq6.onrender.com/health || echo "Ping fallido o iniciando"
