# Koyeb Free Tier App Specification ($0 USD / Mes)
# SOAP Engine & Express Backend Multi-Tenant (Always-on, sin cold starts)
name: taskmaster-app
services:
  - name: taskmaster-service
    type: web
    git:
      repository: github.com/DAARKATAR/TASKMASTER
      branch: produccion
      buildpack: dockerfile
    instance_type: free
    regions:
      - fra
    ports:
      - port: 3000
        path: /
    routes:
      - path: /
        port: 3000
    env:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: "production"
    health_checks:
      - path: /health
        port: 3000
        interval: 30
        timeout: 5
        unhealthy_threshold: 3
        healthy_threshold: 1
