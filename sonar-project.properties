sonar.projectKey=DAARKATAR_TASKMASTER
sonar.organization=daarkatar
sonar.host.url=https://sonarcloud.io

# Alcance de código fuente de producción
sonar.sources=src,frontend/src,api
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,docs/**,frontend/public/**,pruebas-unitarias/**

# Cobertura y suites de pruebas
sonar.tests=pruebas-unitarias
sonar.test.inclusions=pruebas-unitarias/**/*.test.ts,pruebas-unitarias/**/*.test.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Deduplicación y codificación
sonar.sourceEncoding=UTF-8
sonar.cpd.exclusions=docs/**,frontend/public/**,pruebas-unitarias/**
