<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMaster POS API Engine</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #0F172A;
      color: #F8FAFC;
    }
    .card {
      background: #1E293B;
      padding: 36px;
      border-radius: 24px;
      border: 1px solid #334155;
      text-align: center;
      max-width: 420px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      background: rgba(16, 185, 129, 0.15);
      color: #34D399;
      font-weight: 700;
      font-size: 12px;
      font-family: monospace;
      margin-bottom: 16px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 8px 0;
      font-weight: 800;
    }
    p {
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.5;
      margin: 0 0 20px 0;
    }
    .endpoint {
      background: #0F172A;
      padding: 10px 14px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 11px;
      color: #38BDF8;
      border: 1px solid #334155;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● API ENGINE ONLINE</div>
    <h1>TaskMaster Multi-Tenant Backend</h1>
    <p>Servidor Express Serverless ejecutándose en Vercel y conectado a Neon PostgreSQL.</p>
    <div class="endpoint">GET /health ➔ {"status":"healthy"}</div>
  </div>
</body>
</html>
